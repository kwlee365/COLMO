# Robot body group definitions and self-collision limit parameters
parameters:
  # REQUIRED (no code default): construction raises if any of these is missing.
  damping: 0.05              # Levenberg-Marquardt regularization of the IK QP
  max_iter: 10              # IK iterations per frame
  velocity_limit : 10       # joint velocity cap [rad/s] (only if use_velocity_limit)
  # IK solver / loop tuning (externalized; code keeps back-compat defaults if omitted).
  solver : daqp             # QP backend passed to mink.solve_ik
  warmup_iters : 500        # IK iterations on the very first frame (settle from rest)
  ik_convergence_tol : 1.0e-8   # IK loop early-stop: |err_t - err_{t-1}| < tol
  lm_damping : 1.0          # per-FrameTask Levenberg-Marquardt damping
  motion_fps : 30           # frame rate assumed for the foot-contact threshold
  ground_offset : -0.01    # per-frame robot ground offset [m] (apply_ground_offset)
  # Collision-avoidance mode: "cbf" (hard CBF) | "issf" (robustified CBF) | "off".
  collision_mode : issf
  # Per-frame joint-acceleration cap |q_dot - q_dot_prev| <= a_max*dt (rad/s^2).
  # Applied as a SOFT QP constraint (DAQP sense=8): honoured when feasible, yields
  # minimally to the hard collision CBF / joint limits so the QP never goes infeasible.
  # Comment out / set <=0 to disable.
  acceleration_limit : 300000
  # Softness of the accel constraint (DAQP rho_soft): smaller -> nearer-hard / stronger
  # smoothing; larger -> softer / yields more easily. Default 1e-6 (near-hard).
  acceleration_softness : 1.0e-6
  # Enable (true) / disable (false) the SOFT acceleration constraint (soft-only).
  acceleration_limit_soft : true

  # Apply the joint VELOCITY limit as SOFT DAQP rows (like accel), so the QP never
  # goes infeasible and it yields minimally only where it would fight the hard
  # collision CBF. The POSITION (joint-config) limit is always HARD -- the robot never
  # exceeds its joint ranges. When soft, the same velocity_limit is also applied to the
  # free/floating-base 6 DoFs (translation m/s, rotation rad/s).
  velocity_limit_soft : true

  cbf_gain : 0.0015 # alpha = 1.5
  issf_epsilon : 600.0

  # --- Posture (nullspace) regularization ---------------------------------------
  # Low-weight bias of selected joints toward a neutral angle, added as a single
  # mink.PostureTask to BOTH IK stages. Fixes the reduced-DOF orientation trap:
  # tracking shoulder_roll_link orientation drives only pitch+roll (yaw is a child
  # link), so a BACKWARD arm swing saturates shoulder pitch at its +0.873 rad limit
  # and the local velocity-level IK cannot climb back out -> the arm stays stuck
  # behind the body. The posture term supplies a restoring pull toward neutral in the
  # task nullspace, breaking the trap. A CONSTANT cost trades off trap-escape vs tracking
  # (weak = stays stuck, strong = pitch frozen), so posture_schedule (below) is used: this
  # value is the MAX cost, reached only at the joint limit. Map is joint_name -> max cost.
  posture_cost:
    left_shoulder_pitch_joint: 50.0
    right_shoulder_pitch_joint: 50.0
  # Neutral target angle [rad] per joint the posture task biases toward. Default 0.0
  # (model qpos0, ~arm-down) for any listed joint not given here. Only joints in
  # posture_cost are affected. Pitch sign: negative = arm forward, positive = arm back.
  posture_target:
    left_shoulder_pitch_joint: 0.0
    right_shoulder_pitch_joint: 0.0
  # State-dependent posture cost (one-sided soft barrier) -- see the G1 config for the full
  # formula. cost is min_cost up to ramp_start rad, then ramps to posture_cost at the UPPER
  # limit (kapex: +0.873 rad). ramp_start is scaled from the G1 sweet spot (0.5/1.249) to
  # kapex's tighter range -> ~0.35; VERIFY/tune on a kapex clip (raise for more backward
  # reach, lower if it still sticks). enabled=false -> constant posture_cost.
  posture_schedule:
    enabled: true
    min_cost: 0.0
    ramp_start: 0.35
    power: 2.0
    debug: true          # print live per-frame (pitch, frac, scheduled cost); set false to silence

groups:
  torso: ["Pelvis", "Chest", "Head"]
  torso_upper: ["Chest", "Head"]

  l_arm: ["Left_Upper_Arm", "Left_Forearm"]
  r_arm: ["Right_Upper_Arm", "Right_Forearm"]
  l_arm_lower: ["Left_Forearm"]
  r_arm_lower: ["Right_Forearm"]
  l_arm_upper: ["Left_Upper_Arm"]
  r_arm_upper: ["Right_Upper_Arm"]

  l_leg: ["Left_Upper_Leg", "Left_Lower_Leg", "Left_Foot"]
  r_leg: ["Right_Upper_Leg", "Right_Lower_Leg", "Right_Foot"]
  l_leg_lower: ["Left_Lower_Leg", "Left_Foot"]
  r_leg_lower: ["Right_Lower_Leg", "Right_Foot"]

  ground: ["floor"]


collision_limits:
  - name: "body_general"
    pairs:
      - ["l_leg", "r_leg"]
      - ["l_arm", "l_leg"]
      - ["l_arm", "r_leg"]
      - ["r_arm", "l_leg"]
      - ["r_arm", "r_leg"]
      - ["r_arm", "l_arm"]
      - ["l_arm", "torso"]
      - ["r_arm", "torso"]
    margin: 0.0
    detect_dist: 0.05

  - name: "ground_collision"
    pairs:
      - ["l_arm", "ground"]
      - ["r_arm", "ground"]
      - ["r_leg", "ground"]
      - ["l_leg", "ground"]
      - ["torso", "ground"]
    margin: 0.0
    detect_dist: 0.05


# ── Foot contact zero-velocity constraint ─────────────────────────────────────
# Contact detection is based on human motion position difference per frame:
#   delta = ||human_pos_t - human_pos_{t-1}||
# If delta <= threshold * dt  (i.e. human foot speed <= threshold),
# a hard QP inequality pins the robot foot XY velocity to <= velocity_bound.
# threshold is in m/s; velocity_bound is in m/s.
# human_body_name is derived automatically from the IK config (format-agnostic).
# ──────────────────────────────────────────────────────────────────────────────
foot_geoms:
  left:
    - Left_Foot
  right:
    - Right_Foot

foot_contact:
  enabled: false
  threshold: 0.3   # m/s (1 cm/s) — contact activates when human foot speed <= this
  velocity_bound: 0.001 # m/s  — hard XY velocity limit once in contact

  contact_points:
    - body_name: "left_ankle_roll_link"
      local_pos: [0.02, 0.0, -0.02]

    - body_name: "right_ankle_roll_link"
      local_pos: [0.02, 0.0, -0.02]