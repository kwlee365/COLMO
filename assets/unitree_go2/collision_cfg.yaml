# Robot body group definitions and self-collision limit parameters
parameters:
  # REQUIRED (no code default): construction raises if any of these is missing.
  damping: 0.5              # Levenberg-Marquardt regularization of the IK QP
  max_iter: 10              # IK iterations per frame
  # IK solver / loop tuning (externalized; code keeps back-compat defaults if omitted).
  solver : daqp             # QP backend passed to mink.solve_ik
  warmup_iters : 500        # IK iterations on the very first frame (settle from rest)
  ik_convergence_tol : 1.0e-8   # IK loop early-stop: |err_t - err_{t-1}| < tol
  lm_damping : 1.0          # per-FrameTask Levenberg-Marquardt damping
  motion_fps : 30           # frame rate assumed for the foot-contact threshold
  ground_offset : 0.0       # per-frame robot ground offset [m] (apply_ground_offset)
  # Collision-avoidance mode: "cbf" (hard CBF) | "issf" (robustified CBF) | "off".
  collision_mode : issf

  # Enable flags for the three IK limits (a constructor arg, if passed, overrides these).
  use_velocity_limit : true       # FrameVelocityLimit (real per-frame velocity, frame_velocity_limit)
  use_acceleration_limit : true   # FrameAccelerationLimit (real per-frame accel, frame_acceleration_limit)
  use_ik_step_limit : true        # per-iteration IK step clamp (|Δq| <= ik_step_limit * opt.timestep)

  ik_step_limit : 10

  # Quadruped: 12 leg joints (FL/FR/RL/RR x hip/thigh/calf).
  # Acceleration cap [rad/s^2] = motor ctrlrange_max / joint armature (go2.xml).
  # go2.xml uses a uniform armature=0.01; hip/thigh motors +-23.7, calf +-45.43.
  frame_acceleration_limit_soft:
    # front-left leg
    FL_hip_joint: 2370      # 23.7 / 0.01
    FL_thigh_joint: 2370    # 23.7 / 0.01
    FL_calf_joint: 4543     # 45.43 / 0.01
    # front-right leg
    FR_hip_joint: 2370
    FR_thigh_joint: 2370
    FR_calf_joint: 4543
    # rear-left leg
    RL_hip_joint: 2370
    RL_thigh_joint: 2370
    RL_calf_joint: 4543
    # rear-right leg
    RR_hip_joint: 2370
    RR_thigh_joint: 2370
    RR_calf_joint: 4543
  # DAQP soft-constraint rho, SHARED by all soft rows (velocity / acceleration / IK-step):
  # smaller -> nearer-hard / stronger; larger -> softer / yields more easily. Default 1e-6.
  soft_rho : 1.0e-6

  # Velocity cap [rad/s] = URDF <limit velocity=...> (go2.urdf):
  # hip/thigh 30.1, calf 15.70.
  frame_velocity_limit_soft:
    # front-left leg
    FL_hip_joint: 30.1
    FL_thigh_joint: 30.1
    FL_calf_joint: 15.70
    # front-right leg
    FR_hip_joint: 30.1
    FR_thigh_joint: 30.1
    FR_calf_joint: 15.70
    # rear-left leg
    RL_hip_joint: 30.1
    RL_thigh_joint: 30.1
    RL_calf_joint: 15.70
    # rear-right leg
    RR_hip_joint: 30.1
    RR_thigh_joint: 30.1
    RR_calf_joint: 15.70

  cbf_gain : 1.5 # alpha = 1.5
  issf_epsilon : 20.0

groups:
  # ── Trunk ──
  trunk: ["Trunk1", "Trunk2", "Trunk_front", "Trunk_nose"]

  # ── FRONT legs == ARMS (front paws FL/FR are the "hands") ──
  l_arm: ["FL_thigh_col", "FL_calf_col", "FL_calf_col2", "FL"]
  r_arm: ["FR_thigh_col", "FR_calf_col", "FR_calf_col2", "FR"]
  l_arm_lower: ["FL_calf_col", "FL_calf_col2", "FL"]
  r_arm_lower: ["FR_calf_col", "FR_calf_col2", "FR"]

  # ── REAR legs == LEGS (rear paws RL/RR are the "feet") ──
  l_leg: ["RL_hip_col", "RL_thigh_col", "RL_calf_col", "RL_calf_col2", "RL"]
  r_leg: ["RR_hip_col", "RR_thigh_col", "RR_calf_col", "RR_calf_col2", "RR"]
  l_leg_lower: ["RL_calf_col", "RL_calf_col2", "RL"]
  r_leg_lower: ["RR_calf_col", "RR_calf_col2", "RR"]

  # ── Hands vs feet kept as SEPARATE groups ──
  hands: ["FL", "FR"]      # front paws  -> human hands
  feet:  ["RL", "RR"]      # rear paws   -> human feet

  ground: ["floor"]

collision_limits:
  # Self-collision between the four legs (they should never cross).
  - name: "leg_self"
    pairs:
      - ["l_arm", "r_arm"]    # front-left  <-> front-right
      - ["l_leg", "r_leg"]    # rear-left   <-> rear-right
      - ["l_arm", "l_leg"]    # left side   (front <-> rear)
      - ["r_arm", "r_leg"]    # right side  (front <-> rear)
      - ["l_arm", "r_leg"]    # diagonals
      - ["r_arm", "l_leg"]
    margin: 0.0
    detect_dist: 0.04

  # Keep the WHOLE robot off the floor: every leg link (thigh/calf/paw) + trunk.
  # l_arm/r_arm already include the front paws (hands); l_leg/r_leg include the rear
  # paws (feet), so this also covers what the old feet/hands pairs did.
  - name: "ground_collision"
    pairs:
      - ["l_arm", "ground"]   # front-left leg  (arm): thigh + calf + hand
      - ["r_arm", "ground"]   # front-right leg (arm)
      - ["l_leg", "ground"]   # rear-left leg:  thigh + calf + foot
      - ["r_leg", "ground"]   # rear-right leg
      - ["trunk", "ground"]
    margin: 0.0
    detect_dist: 0.03

# ── Foot geoms: used to compute the per-frame robot ground offset (lowest foot) ──
# For this mapping only the REAR paws act as feet, so the ground reference uses
# them (the front paws follow the arms and are usually off the ground).
foot_geoms:
  left:
    - RL
  right:
    - RR

# ── Foot contact zero-velocity constraint ─────────────────────────────────────
# Disabled (mirrors G1/KAPEX defaults). The contact-point body_name must be a
# robot BODY that also appears in the IK match table so its paired human body can
# be derived. For Go2 the "feet" are the rear paws -> RL_foot / RR_foot.
foot_contact:
  enabled: false
  threshold: 0.3        # m/s — contact activates when human foot speed <= this
  velocity_bound: 0.001 # m/s — hard XY velocity limit once in contact

  contact_points:
    - body_name: "RL_foot"
      local_pos: [0.0, 0.0, 0.0]
    - body_name: "RR_foot"
      local_pos: [0.0, 0.0, 0.0]
